name: ETL

on:
  schedule:
    # In-season nightly (Mon-Wed) 06:00 UTC (~2am ET) after nflverse's overnight refresh
    - cron: "0 6 * 9-12,1 2,3"
    # Wednesday 10:00 UTC (6am ET): freshness target from the PRD
    - cron: "0 10 * 9-12,1 3"
    # Projection reruns: Saturday 02:00 UTC (Fri night ET) and Sunday 14:00 UTC (10am ET)
    - cron: "0 2 * 9-12,1 6"
    - cron: "0 14 * 9-12,1 0"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to process (space separated). Blank = current season."
        required: false
        default: ""
      projections_only:
        description: "Only rerun projections (injury refresh)"
        type: boolean
        default: false

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Install
        run: pip install -r etl/requirements.txt
      - name: Cache nflverse downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/nflreadpy
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "${{ github.event.schedule }}" = "0 2 * 9-12,1 6" ] || [ "${{ github.event.schedule }}" = "0 14 * 9-12,1 0" ]; }; then
            echo "args=--projections-only" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.projections_only }}" = "true" ]; then
            echo "args=--projections-only" >> "$GITHUB_OUTPUT"
          else
            echo "args=--validate ${{ inputs.seasons != '' && format('--seasons {0}', inputs.seasons) || '' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Run ETL
        working-directory: etl
        run: python run_etl.py --init-db ${{ steps.mode.outputs.args }}
      - name: Revalidate site cache
        if: ${{ secrets.REVALIDATE_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.REVALIDATE_URL }}" || true
